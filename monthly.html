<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월간 일정표 - 연세대학교 조정부</title>
    <style>
        /* 기본 디자인 설정 */
        body { font-family: 'Pretendard', sans-serif; padding: 40px; max-width: 1200px; margin: 0 auto; background-color: #ffffff; }
        h2 { color: #003876; border-bottom: 2px solid #003876; padding-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: baseline; }
        .month-title { font-size: 1.8rem; color: #333; }
        
        /* 달력 그리드 디자인 */
        .calendar-wrapper { margin-top: 30px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background-color: #ddd; gap: 1px; }
        
        /* 요일 헤더 */
        .day-header { padding: 12px 0; text-align: center; font-weight: bold; background-color: #f8f9fa; font-size: 1.1rem; }
        .day-header.sun { color: #d9534f; }
        .day-header.sat { color: #0275d8; }
        
        /* 날짜 칸 */
        .calendar-cell { background-color: #ffffff; min-height: 140px; padding: 10px 0; display: flex; flex-direction: column; }
        .calendar-cell.empty { background-color: #fdfdfd; }
        
        .date-num { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: #555; padding: 0 10px; }
        .calendar-cell.sun .date-num { color: #d9534f; }
        .calendar-cell.sat .date-num { color: #0275d8; }
        
        /* 일정 텍스트 박스 공통 */
        .event-box { 
            background-color: #e6f0fa; 
            color: #003876; 
            padding: 8px 10px; 
            font-size: 0.9rem; 
            line-height: 1.4; 
            margin-bottom: 4px; 
            word-break: keep-all; 
            z-index: 2; 
            position: relative; 
        }
        
        /* 블록 연속성 처리를 위한 디테일 스타일 (음수 마진으로 칸 사이의 틈새를 덮음) */
        .event-box.single { 
            margin: 0 10px 4px 10px; 
            border-radius: 4px; 
            border-left: 4px solid #003876; 
        }
        .event-box.start { 
            margin: 0 -2px 4px 10px; 
            border-radius: 4px 0 0 4px; 
            border-left: 4px solid #003876; 
        }
        .event-box.middle { 
            margin: 0 -2px 4px -2px; 
            border-radius: 0; 
            border-left: none; 
            padding-left: 14px; 
        }
        .event-box.end { 
            margin: 0 10px 4px -2px; 
            border-radius: 0 4px 4px 0; 
            border-left: none; 
            padding-left: 14px; 
        }
        
        #loading { text-align: center; color: #666; margin-top: 50px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h2>
        <span>월간 일정표 (Monthly Schedule)</span>
        <span id="display-month" class="month-title"></span>
    </h2>
    
    <div id="loading">데이터를 불러오는 중입니다...</div>

    <div id="calendar-container" class="calendar-wrapper" style="display: none;">
        <div class="calendar-grid" id="calendar-grid">
            <!-- 요일 헤더 -->
            <div class="day-header sun">일</div>
            <div class="day-header">월</div>
            <div class="day-header">화</div>
            <div class="day-header">수</div>
            <div class="day-header">목</div>
            <div class="day-header">금</div>
            <div class="day-header sat">토</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 💡 [여기에 링크 붙여넣기]
        // 끝부분이 반드시 pub?output=tsv 로 끝나도록 수정되었습니다.
        // ==========================================
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSimq_zZsoAOxpi2OR7o7dqveJ4q4ZNnxF03ofwiE1hjBeX5zaAmQMWG_5wu9XN8vUC31TXgpGtV0_b/pub?output=tsv";

        fetch(sheetUrl)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                
                // 1. 기준 연월 파싱
                let targetYear = new Date().getFullYear();
                let targetMonth = new Date().getMonth() + 1;

                if (rows.length > 0) {
                    const headerRow = rows[0].split('\t');
                    if (headerRow.length >= 2) {
                        const dateStr = headerRow[1].trim(); 
                        if (dateStr.includes('-')) {
                            const parts = dateStr.split('-');
                            targetYear = parseInt(parts[0]);
                            targetMonth = parseInt(parts[1]);
                        }
                    }
                }

                document.getElementById('display-month').innerText = `${targetYear}년 ${targetMonth}월`;

                // 2. 날짜별 일정 배열 생성
                const rawEvents = {};
                for (let i = 2; i < rows.length; i++) {
                    if (rows[i].trim() === "") continue;
                    const columns = rows[i].split('\t');
                    if (columns.length >= 2) {
                        const dayNum = parseInt(columns[0].trim());
                        const eventText = columns[1].trim();
                        if (!isNaN(dayNum) && eventText) {
                            if (!rawEvents[dayNum]) rawEvents[dayNum] = [];
                            rawEvents[dayNum].push(eventText);
                        }
                    }
                }

                // 강력한 띄어쓰기 무시 필터: 모든 공백 및 숨김 문자 제거 후 비교
                const normalize = str => str.replace(/[\s"'\r\n]/g, '').toLowerCase();

                // 3. 블록 연속성 계산 알고리즘
                const eventMap = {};
                const lastDate = new Date(targetYear, targetMonth, 0).getDate();

                for (let day = 1; day <= lastDate; day++) {
                    if (!rawEvents[day]) continue;
                    if (!eventMap[day]) eventMap[day] = [];

                    const dayOfWeek = new Date(targetYear, targetMonth - 1, day).getDay();

                    rawEvents[day].forEach(text => {
                        const normText = normalize(text);
                        
                        // 앞뒤 날짜의 일정 중 '띄어쓰기를 무시했을 때' 완전히 똑같은 일정이 있는지 검사
                        let prevDayHas = (day > 1) && rawEvents[day - 1] && rawEvents[day - 1].some(t => normalize(t) === normText);
                        let nextDayHas = (day < lastDate) && rawEvents[day + 1] && rawEvents[day + 1].some(t => normalize(t) === normText);

                        // 토요일에서 일요일로 넘어갈 때는 달력 줄이 바뀌므로 시각적 연결을 끊음
                        if (dayOfWeek === 0) prevDayHas = false; 
                        if (dayOfWeek === 6) nextDayHas = false; 

                        let type = 'single';
                        if (prevDayHas && nextDayHas) type = 'middle';
                        else if (!prevDayHas && nextDayHas) type = 'start';
                        else if (prevDayHas && !nextDayHas) type = 'end';

                        eventMap[day].push({ text, type });
                    });
                }

                renderCalendar(targetYear, targetMonth, eventMap);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('calendar-container').style.display = 'block';
            })
            .catch(error => {
                console.error("데이터 로드 오류:", error);
                document.getElementById('loading').innerText = "데이터를 불러오지 못했습니다. 스프레드시트 링크를 확인해 주세요.";
            });

        function renderCalendar(year, month, events) {
            const grid = document.getElementById('calendar-grid');
            const firstDay = new Date(year, month - 1, 1).getDay();
            const lastDate = new Date(year, month, 0).getDate();
            
            let html = "";

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="calendar-cell empty"></div>`;
            }

            for (let day = 1; day <= lastDate; day++) {
                const currentDayOfWeek = new Date(year, month - 1, day).getDay();
                let dayClass = "calendar-cell";
                if (currentDayOfWeek === 0) dayClass += " sun";
                if (currentDayOfWeek === 6) dayClass += " sat";

                let eventHtml = "";
                if (events[day]) {
                    events[day].forEach(evt => {
                        // 이어지는 뒷 블록들의 글자는 투명하게 숨겨서 하나의 긴 막대처럼 보이게 처리
                        const textStyle = (evt.type === 'middle' || evt.type === 'end') ? 'color: transparent; user-select: none;' : '';
                        eventHtml += `<div class="event-box ${evt.type}">
                                          <span style="${textStyle}">${evt.text}</span>
                                      </div>`;
                    });
                }

                html += `<div class="${dayClass}">
                            <div class="date-num">${day}</div>
                            ${eventHtml}
                         </div>`;
            }

            const totalCells = firstDay + lastDate;
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 0; i < remainingCells; i++) {
                html += `<div class="calendar-cell empty"></div>`;
            }

            grid.innerHTML += html;
        }
    </script>
</body>
</html>
