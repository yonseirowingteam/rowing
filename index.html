<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연세대학교 조정부 (Yonsei Rowing Team)</title>

    <!-- 💡 파비콘 (브라우저 탭 아이콘) 설정 -->
    <link rel="icon" href="yrt_logo.png" type="image/png">
    <link rel="apple-touch-icon" href="yrt_logo.png">

    <!-- 💡 카카오톡 등 링크 공유 시 미리보기(Open Graph) 설정 -->
    <meta property="og:title" content="연세대학교 조정부 (Yonsei Rowing Team)">
    <meta property="og:description" content="Yonsei Rowing Team 일정 관리 및 훈련 스케줄">
    <meta property="og:type" content="website">
    
    <!-- 🚨 실제 웹사이트 주소 -->
    <meta property="og:url" content="https://yonseirowingteam.github.io/rowing">
    <meta property="og:image" content="https://yonseirowingteam.github.io/rowing/yrt_logo.png">

    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background-color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 💡 메인 로고 디자인 */
        .main-logo {
            width: 150px; /* 로고 크기 */
            height: auto;
            margin-bottom: 20px; /* 로고와 제목 사이의 간격 */
        }
        
        /* 대표 문자열 (연세 블루 포인트) */
        h1 {
            color: #003876;
            font-size: 2.5rem;
            margin-bottom: 10px;
            margin-top: 0; /* 로고와의 여백 조화를 위해 상단 마진 제거 */
            letter-spacing: -0.05em;
        }
        
        p {
            color: #666666;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* 버튼 컨테이너 및 디자인 */
        .btn-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            display: inline-block;
            padding: 20px 40px;
            background-color: #ffffff;
            color: #003876;
            border: 2px solid #003876;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #003876;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 56, 118, 0.2);
        }

        /* ========================================= */
        /* 반응형 모바일 디자인 (화면 폭 768px 이하일 때 적용) */
        /* ========================================= */
        @media (max-width: 768px) {
            /* 💡 모바일 환경에서 로고 크기 축소 */
            .main-logo {
                width: 120px;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 2rem;
                text-align: center;
            }
            
            p {
                font-size: 1rem;
                margin-bottom: 40px;
                text-align: center;
                padding: 0 20px;
                word-break: keep-all;
            }

            .btn-container {
                flex-direction: column;
                gap: 15px;
                width: 80%;
                max-width: 320px;
            }

            .btn {
                width: 100%;
                box-sizing: border-box;
                padding: 16px 20px;
                font-size: 1.1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- 💡 텍스트 위 중앙에 삽입된 로고 -->
    <img src="yrt_logo.png" alt="연세대학교 조정부 로고" class="main-logo">
    
    <h1>연세대학교 조정부</h1>
    <p>Yonsei Rowing Team 일정 관리 및 훈련 스케줄</p>

    <div class="btn-container">
        <a href="monthly.html" target="_blank" class="btn">월간 일정표 확인</a>
        <a href="training.html" target="_blank" class="btn">2주 훈련 스케줄 확인</a>
    </div>

</body>
</html>
