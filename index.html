<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연세대학교 조정부 (Yonsei Rowing Team)</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background-color: #ffffff; /* 깔끔한 흰색 배경 */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        /* 대표 문자열 (연세 블루 포인트) */
        h1 {
            color: #003876; /* 연세 블루 */
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }
        
        p {
            color: #666666;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* 버튼 컨테이너 및 디자인 */
        .btn-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            display: inline-block;
            padding: 20px 40px;
            background-color: #ffffff;
            color: #003876;
            border: 2px solid #003876;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #003876;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 56, 118, 0.2);
        }
    </style>
</head>
<body>

    <h1>연세대학교 조정부</h1>
    <p>Yonsei Rowing Team 일정 관리 및 훈련 스케줄</p>

    <div class="btn-container">
        <!-- target="_blank" 속성으로 새 창에서 열리도록 설정 -->
        <a href="monthly.html" target="_blank" class="btn">월간 일정표 확인</a>
        <a href="training.html" target="_blank" class="btn">2주 훈련 스케줄 확인</a>
    </div>

</body>
</html>
