<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연세대학교 조정부 (Yonsei Rowing Team)</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background-color: #ffffff; /* 깔끔한 흰색 배경 */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        /* 대표 문자열 (연세 블루 포인트) */
        h1 {
            color: #003876; /* 연세 블루 */
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }
        
        p {
            color: #666666;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* 버튼 컨테이너 및 디자인 */
        .btn-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            display: inline-block;
            padding: 20px 40px;
            background-color: #ffffff;
            color: #003876;
            border: 2px solid #003876;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #003876;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 56, 118, 0.2);
        }

        /* ========================================= */
        /* 반응형 모바일 디자인 (화면 폭 768px 이하일 때 적용) */
        /* ========================================= */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem; /* 제목 크기 축소 */
                text-align: center;
            }
            
            p {
                font-size: 1rem; /* 설명 텍스트 크기 축소 */
                margin-bottom: 40px;
                text-align: center;
                padding: 0 20px;
                word-break: keep-all; /* 단어 단위로 줄바꿈되어 깔끔하게 보이도록 설정 */
            }

            .btn-container {
                flex-direction: column; /* 모바일에서는 버튼을 세로로 배치 */
                gap: 15px;
                width: 80%; /* 화면 너비에 맞게 조정 */
                max-width: 320px; /* 버튼이 너무 넓어지지 않도록 최대 너비 제한 */
            }

            .btn {
                width: 100%; /* 버튼이 컨테이너 너비를 꽉 채우도록 설정 */
                box-sizing: border-box;
                padding: 16px 20px;
                font-size: 1.1rem;
                text-align: center; /* 버튼 안의 글자 중앙 정렬 */
            }
        }
    </style>
</head>
<body>

    <h1>연세대학교 조정부</h1>
    <p>Yonsei Rowing Team 일정 관리 및 훈련 스케줄</p>

    <div class="btn-container">
        <!-- target="_blank" 속성으로 새 창에서 열리도록 설정 -->
        <a href="monthly.html" target="_blank" class="btn">월간 일정표 확인</a>
        <a href="training.html" target="_blank" class="btn">2주 훈련 스케줄 확인</a>
    </div>

</body>
</html>
