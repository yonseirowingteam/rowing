<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조정부 운동인증 챌린지</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* Streamlit 테마 모방 CSS */
        :root {
            --primary: #ff4b4b;
            --bg: #ffffff;
            --text-main: #31333F;
            --text-muted: #7d7d8e;
            --border: #e6e6e9;
            --card-bg: #f0f2f6;
            --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font);
            color: var(--text-main);
            background-color: var(--bg);
            margin: 0; padding: 20px 10px;
            line-height: 1.6;
        }
        .container { max-width: 700px; margin: 0 auto; }
        
        h1 { text-align: center; margin: 0 0 5px 0; font-size: 2rem; color: var(--text-main); }
        .caption { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
        .divider { height: 1px; background-color: var(--border); margin: 20px 0; }
        
        .info-box { background-color: #e8f4fd; color: #004280; padding: 15px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; }
        
        select {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 1rem; margin-bottom: 15px; background-color: var(--bg); font-family: var(--font);
        }

        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 25px; }
        .tab-btn {
            flex: 1; padding: 12px 5px; background: transparent; border: none; font-size: 1rem;
            color: var(--text-muted); cursor: pointer; transition: 0.2s;
        }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }

        .metric-row { display: flex; gap: 15px; margin-bottom: 25px; }
        .metric-card { flex: 1; display: flex; flex-direction: column; }
        .metric-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 3px; }
        .metric-value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); line-height: 1.2; }
        .metric-delta { font-size: 0.85rem; color: var(--text-muted); margin-top: 3px; }

        .rank-board { display: flex; gap: 10px; margin-bottom: 30px; text-align: center; }
        .rank-card { flex: 1; background-color: var(--card-bg); padding: 15px 5px; border-radius: 10px; box-shadow: 1px 1px 3px rgba(0,0,0,0.05); }
        .rank-card .medal { font-size: 1.6rem; margin-bottom: 5px; }
        .rank-card .name { font-size: 0.9rem; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
        .rank-card .ticket { font-size: 1rem; font-weight: 700; color: var(--primary); }

        .progress-wrapper { margin-bottom: 15px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .progress-bg { width: 100%; height: 12px; background-color: var(--border); border-radius: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--primary); transition: width 0.8s ease; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
        th { text-align: left; padding: 10px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }

        .gallery-item { margin-bottom: 30px; }
        .gallery-header { font-weight: 600; margin-bottom: 5px; }
        .gallery-date { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; }
        .gallery-memo { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; }
        .gallery-item img { width: 100%; border-radius: 8px; display: block; margin-top: 10px; }
        
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .photo-grid-item img { width: 100%; border-radius: 8px; display: block; }
        .photo-grid-caption { font-size: 0.8rem; text-align: center; color: var(--text-muted); margin-top: 5px; }

        #loading { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--text-muted); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🚣‍♀️ 운동인증 챌린지</h1>
    <div class="caption">One team, one spirit.</div>
    <div class="divider"></div>

    <div id="loading">데이터를 불러오는 중입니다... 🚣</div>

    <div id="app" style="display: none;">
        <select id="season-select" onchange="loadSeason()">
            <option value="10">🏆 10월 (시즌2 - 진행중)</option>
            <option value="9">🏆 9월 (시즌1 - 종료)</option>
        </select>
        
        <div id="season-info" class="info-box"></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('tab-rank', this)">🏆 랭킹 보드</button>
            <button class="tab-btn" onclick="openTab('tab-mypage', this)">👤 내 기록실</button>
            <button class="tab-btn" onclick="openTab('tab-gallery', this)">📸 갤러리</button>
        </div>

        <div id="tab-rank" class="tab-content active">
            <h3 style="margin-top:0;">🔥 <span class="month-txt"></span>월 명예의 전당</h3>
            <div id="rule-caption" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;"></div>
            
            <h4 style="margin-bottom: 10px;">🎟️ 추첨권 획득 순위</h4>
            <div id="rank-tickets" class="rank-board"></div>
            
            <h4 style="margin-bottom: 10px;">🚣 에르고 누적 거리 순위 (Top 5)</h4>
            <div id="rank-distance"></div>
        </div>

        <div id="tab-mypage" class="tab-content">
            <h3 style="margin-top:0;">🔍 <span class="month-txt"></span>월 내 기록 찾아보기</h3>
            <select id="member-select" onchange="renderMyPage()">
                <option value="">본인의 이름을 선택하세요</option>
            </select>

            <div id="mypage-content" style="display: none; margin-top: 20px;">
                <div class="metric-row">
                    <div class="metric-card">
                        <div class="metric-label">내 추첨권</div>
                        <div class="metric-value" id="my-ticket">0 장</div>
                        <div class="metric-delta" id="my-ticket-detail"></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">내 에르고 누적</div>
                        <div class="metric-value" id="my-ergo">0 m</div>
                        <div class="metric-delta" id="my-ergo-detail"></div>
                    </div>
                </div>

                <h4 style="margin-bottom: 10px;">🎯 50,000m 보너스(3장) 진행도</h4>
                <div class="progress-wrapper">
                    <div class="progress-header">
                        <span id="my-progress-msg"></span>
                        <span id="my-progress-remain" style="color: var(--text-muted);"></span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" id="my-progress-bar" style="width: 0%;"></div>
                    </div>
                </div>

                <h4 style="margin-top: 30px; margin-bottom: 10px;">📝 최근 인증 내역</h4>
                <div style="overflow-x: auto;">
                    <table id="my-table">
                        <thead><tr><th>날짜</th><th>운동종류</th><th>총거리</th><th>메모</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <h4 style="margin-top: 30px; margin-bottom: 15px;">📸 내 인증 사진 모아보기</h4>
                <div id="my-gallery" class="photo-grid"></div>
            </div>
        </div>

        <div id="tab-gallery" class="tab-content">
            <h3 style="margin-top:0;">📸 <span class="month-txt"></span>월 훈련 갤러리</h3>
            <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">부원들의 뜨거운 땀방울을 확인하세요!</div>
            <div id="global-gallery"></div>
        </div>
    </div>
</div>

<script>
    // 💡 구글 시트 웹에 게시 CSV 주소
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKSCkdKmmNi07nmmO5RN6vDmt_dobOqdCpluVAoP-91dyu36nyuMjuXJXMXrzQDquOq9seEpHtN5_6/pub?gid=995447885&single=true&output=csv";
    const TARGET_METERS = 50000;
    
    let allData = [];
    let curData = [];
    let ticketStats = [];
    let currentMonth = 10;

    function extractDriveUrl(text) {
        if (!text) return null;
        let match = text.match(/id=([a-zA-Z0-9_-]+)/) || text.match(/\/d\/([a-zA-Z0-9_-]+)/);
        return match ? `https://lh3.googleusercontent.com/d/${match[1]}` : null;
    }

    function parseDate(str) {
        if (!str) return null;
        let s = str.trim();
        if (!isNaN(s) && !s.includes(':')) return new Date((parseFloat(s) - 25569) * 86400 * 1000);
        
        let nums = s.match(/\d+/g);
        if (nums && nums.length >= 3) {
            let y = parseInt(nums[0]); 
            let m = parseInt(nums[1]);
            let d = parseInt(nums[2]);
            if (y <= 12 && d > 1000) { let t = y; y = d; d = m; m = t; } 
            else if (y < 100) y += 2000;
            
            let date = new Date(y, m - 1, d);
            if (nums.length >= 5) {
                let hh = parseInt(nums[3]);
                let mm = parseInt(nums[4]);
                let ss = nums.length >= 6 ? parseInt(nums[5]) : 0;
                let upStr = s.toUpperCase();
                if ((upStr.includes('오후') || upStr.includes('PM')) && hh < 12) hh += 12;
                if ((upStr.includes('오전') || upStr.includes('AM')) && hh === 12) hh = 0;
                date.setHours(hh, mm, ss);
            }
            return date;
        }
        return new Date(str);
    }

    function formatDateTime(dateObj) {
        if(!dateObj || isNaN(dateObj.getTime())) return "날짜 미상";
        let m = String(dateObj.getMonth() + 1).padStart(2, '0');
        let d = String(dateObj.getDate()).padStart(2, '0');
        let hh = String(dateObj.getHours()).padStart(2, '0');
        let mm = String(dateObj.getMinutes()).padStart(2, '0');
        return `${dateObj.getFullYear()}-${m}-${d} ${hh}:${mm}`;
    }

    // 💡 [핵심 해결 로직] 헤더 이름 무시하고 무조건 열(Column) 순서대로 가져오기
    Papa.parse(CSV_URL, {
        download: true,
        header: false, // 헤더 텍스트 찾기 옵션 끄기 (Python의 index 매핑과 동일)
        skipEmptyLines: true,
        complete: function(results) {
            allData = [];
            
            // 첫 번째 줄(index 0)은 텍스트 기둥이므로 건너뛰고 1부터 시작
            for (let i = 1; i < results.data.length; i++) {
                let row = results.data[i];
                
                // 0:날짜, 1:이름, 2:총거리, 3:운동종류, 4:사진링크, 5/6:구분/메모
                let rawDate = row[0] || '';
                let rawName = row[1] || '';
                let rawDist = row[2] || '0';
                let rawType = row[3] || '';
                let rawPhoto = row[4] || '';
                
                // 질문 삭제로 인해 열 순서가 당겨졌을 경우 보정
                let rawGroup = '기존';
                let rawMemo = '';
                if (row.length > 6) {
                    rawGroup = row[5] || '기존';
                    rawMemo = row[6] || '';
                } else if (row.length === 6) {
                    rawMemo = row[5] || ''; // '구분' 질문이 사라지고 '메모'가 당겨진 경우
                }

                if (rawName.trim() !== '' && rawDate.trim() !== '') {
                    let dObj = parseDate(rawDate);
                    let dist = parseInt(String(rawDist).replace(/,/g, '')) || 0;
                    let ergo = (rawType.includes('러닝') || rawType.includes('달리기')) ? 0 : dist;
                    let cleanName = rawName.replace(/\s/g, '');
                    
                    let dataObj = {
                        idx: i,
                        dateObj: dObj,
                        month: (dObj && !isNaN(dObj.getTime())) ? dObj.getMonth() + 1 : 0,
                        dateStr: formatDateTime(dObj),
                        name: cleanName,
                        type: rawType,
                        dist: dist,
                        ergoDist: ergo,
                        photo: extractDriveUrl(rawPhoto),
                        memo: rawMemo,
                        group: cleanName === '강서윤' ? '신입' : (rawGroup.trim() || '기존')
                    };
                    allData.push(dataObj);
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadSeason();
        },
        error: function(err) {
            document.getElementById('loading').innerText = "데이터를 불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
        }
    });

    function loadSeason() {
        currentMonth = parseInt(document.getElementById('season-select').value);
        document.querySelectorAll('.month-txt').forEach(el => el.innerText = currentMonth);
        
        let infoBox = document.getElementById('season-info');
        let ruleBox = document.getElementById('rule-caption');
        
        if (currentMonth === 9) {
            infoBox.innerHTML = "ℹ️ <b>9월 챌린지는 종료되었습니다.</b> (기존 부원 전용 / 러닝 미포함 / 랭킹 보너스 없음)";
            ruleBox.innerHTML = "💡 추첨권 규칙: 인증 1회당 <b>1장</b> | 5만m 달성 <b>+3장</b>";
            curData = allData.filter(r => r.month === 9 && r.group === '기존');
            curData.forEach(r => r.ergoDist = r.dist);
        } else {
            infoBox.innerHTML = "ℹ️ <b>10월 챌린지 진행 중!</b> (전체 부원 대상 / 러닝 포함 / 에르고 1~3위 보너스 지급)";
            ruleBox.innerHTML = "💡 추첨권 규칙: 인증 1회당 <b>1장</b> | 에르고 5만m 달성 <b>+3장</b> | 에르고 랭킹 1~3위 <b>+3, +2, +1장</b>";
            curData = allData.filter(r => r.month === 10);
        }

        calcStats();
        renderRank();
        
        let select = document.getElementById('member-select');
        select.innerHTML = '<option value="">본인의 이름을 선택하세요</option>';
        [...new Set(curData.map(r => r.name))].sort().forEach(nm => {
            select.innerHTML += `<option value="${nm}">${nm}</option>`;
        });
        document.getElementById('mypage-content').style.display = 'none';
        
        renderGallery();
    }

    function calcStats() {
        let map = {};
        curData.forEach(r => {
            if(!map[r.name]) map[r.name] = { name: r.name, count: 0, ergo: 0 };
            map[r.name].count++;
            map[r.name].ergo += r.ergoDist;
        });
        
        ticketStats = Object.values(map);
        ticketStats.forEach(s => {
            s.base = s.count;
            s.b50k = s.ergo >= TARGET_METERS ? 3 : 0;
            s.bRank = 0;
        });

        let excluded = currentMonth === 10 ? ['김경일', '강예은'] : [];
        let rEligible = ticketStats.filter(s => !excluded.includes(s.name) && s.ergo > 0);
        rEligible.sort((a,b) => b.ergo - a.ergo);

        if(currentMonth === 10) {
            for(let i=0; i < Math.min(rEligible.length, 3); i++) {
                let target = ticketStats.find(s => s.name === rEligible[i].name);
                if(target) target.bRank = 3 - i;
            }
        }
        ticketStats.forEach(s => s.total = s.base + s.b50k + s.bRank);
    }

    function renderRank() {
        let excluded = currentMonth === 10 ? ['김경일', '강예은'] : [];
        
        let tkts = ticketStats.filter(s => !excluded.includes(s.name));
        tkts.sort((a,b) => b.total - a.total || b.ergo - a.ergo);
        
        let html = '';
        let medals = ["🥇", "🥈", "🥉"];
        for(let i=0; i < Math.min(tkts.length, 3); i++) {
            html += `<div class="rank-card">
                        <div class="medal">${medals[i]}</div>
                        <div class="name">${tkts[i].name}</div>
                        <div class="ticket">${tkts[i].total}장</div>
                     </div>`;
        }
        document.getElementById('rank-tickets').innerHTML = html || "<div style='color:var(--text-muted); font-size:0.9rem;'>데이터가 없습니다.</div>";

        let dists = ticketStats.filter(s => !excluded.includes(s.name) && s.ergo > 0);
        dists.sort((a,b) => b.ergo - a.ergo);
        
        let dHtml = '';
        for(let i=0; i < Math.min(dists.length, 5); i++) {
            let row = dists[i];
            let pct = Math.min((row.ergo / TARGET_METERS) * 100, 100);
            let bStr = (currentMonth === 10 && i < 3) ? ` <span style="color:var(--primary); font-size:0.8rem;">${medals[i]}(+${3-i}장)</span>` : "";
            
            dHtml += `
                <div class="progress-wrapper">
                    <div class="progress-header">
                        <span><b>${i+1}위. ${row.name}</b>${bStr}</span>
                        <span>${row.ergo.toLocaleString()}m</span>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${pct}%"></div></div>
                </div>`;
        }
        document.getElementById('rank-distance').innerHTML = dHtml || "<div style='color:var(--text-muted); font-size:0.9rem;'>데이터가 없습니다.</div>";
    }

    function renderMyPage() {
        let name = document.getElementById('member-select').value;
        let box = document.getElementById('mypage-content');
        if(!name) { box.style.display = 'none'; return; }
        box.style.display = 'block';

        let s = ticketStats.find(x => x.name === name) || {total:0, base:0, b50k:0, bRank:0, ergo:0, count:0};
        
        document.getElementById('my-ticket').innerText = `${s.total} 장`;
        document.getElementById('my-ticket-detail').innerText = currentMonth === 10 ? 
            `기본 ${s.base} + 5만m ${s.b50k} + 랭킹 ${s.bRank}` : `기본 ${s.base} + 보너스 ${s.b50k}`;
            
        document.getElementById('my-ergo').innerText = `${s.ergo.toLocaleString()} m`;
        document.getElementById('my-ergo-detail').innerText = `총 인증(러닝 포함): ${s.count}회`;

        let rem = Math.max(0, TARGET_METERS - s.ergo);
        let pct = Math.min((s.ergo / TARGET_METERS)*100, 100);
        
        document.getElementById('my-progress-bar').style.width = '0%';
        setTimeout(() => { document.getElementById('my-progress-bar').style.width = pct + '%'; }, 50);
        
        if(rem > 0) {
            document.getElementById('my-progress-msg').innerHTML = "보너스 달성 진행도";
            document.getElementById('my-progress-remain').innerHTML = `보너스까지 <b style="color:var(--primary)">${rem.toLocaleString()}m</b> 남음`;
        } else {
            document.getElementById('my-progress-msg').innerHTML = "🎉 <b>50,000m 달성!</b>";
            document.getElementById('my-progress-remain').innerText = "보너스 3장 획득 완료";
        }

        let myD = curData.filter(r => r.name === name).sort((a,b) => b.dateObj - a.dateObj || b.idx - a.idx);
        let tb = '';
        myD.forEach(r => {
            tb += `<tr><td>${r.dateStr.split(' ')[0]}</td><td>${r.type}</td><td>${r.dist.toLocaleString()}</td><td>${r.memo}</td></tr>`;
        });
        document.querySelector('#my-table tbody').innerHTML = tb;

        let myP = myD.filter(r => r.photo);
        let phtml = myP.length ? '' : '<div style="color:var(--text-muted); font-size:0.9rem;">등록된 사진이 없습니다.</div>';
        myP.forEach(r => {
            let cap = r.dist > 0 ? `${r.dist.toLocaleString()}m` : r.type;
            phtml += `<div class="photo-grid-item"><img src="${r.photo}"><div class="photo-grid-caption">${r.dateStr.split(' ')[0]} (${cap})</div></div>`;
        });
        document.getElementById('my-gallery').innerHTML = phtml;
    }

    function renderGallery() {
        let pData = curData.filter(r => r.photo).sort((a,b) => b.dateObj - a.dateObj || b.idx - a.idx);
        let html = pData.length ? '' : '<div style="color:var(--text-muted); font-size:0.9rem;">아직 사진이 없습니다.</div>';
        
        pData.slice(0, 10).forEach(r => {
            let mHtml = r.memo ? `<div class="gallery-memo">💬 ${r.memo}</div>` : '';
            html += `<div class="gallery-item">
                        <div class="gallery-header">${r.name} 님의 인증 🏃‍♂️ <span class="gallery-date">(${r.dateStr})</span></div>
                        ${mHtml}
                        <img src="${r.photo}">
                     </div><div class="divider"></div>`;
        });
        document.getElementById('global-gallery').innerHTML = html;
    }

    function openTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
